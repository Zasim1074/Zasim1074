<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">AI report pipeline</title>
  <desc id="desc">Approved audit reports are batched weekly to the Claude API, stored in the database, and shown in the client portal.</desc>
  <style>
    .canvas { fill: #0b1220; }
    .node { fill: #111c2e; stroke: #52647d; opacity: 0; }
    .label { fill: #f1f5f9; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .connector { fill: none; stroke: #7c9bbd; stroke-width: 2; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 7s linear infinite; }
    .n1 { animation: appear 7s linear infinite; }
    .n2 { animation: appear 7s linear 0.7s infinite; }
    .n3 { animation: appear 7s linear 1.4s infinite; }
    .n4 { animation: appear 7s linear 2.1s infinite; }
    .n5 { animation: appear 7s linear 2.8s infinite; }
    .c1 { animation-delay: 0.45s; }
    .c2 { animation-delay: 1.15s; }
    .c3 { animation-delay: 1.85s; }
    .c4 { animation-delay: 2.55s; }
    .traveler { fill: #67e8f9; animation: travel 7s linear infinite; }
    @keyframes appear {
      0%, 4% { opacity: 0; }
      12%, 88% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes draw {
      0%, 8% { stroke-dashoffset: 24; }
      18%, 88% { stroke-dashoffset: 0; }
      96%, 100% { stroke-dashoffset: 24; }
    }
    @keyframes travel {
      0%, 12% { transform: translate(180px, 66px); opacity: 0; }
      16% { opacity: 1; }
      84% { transform: translate(180px, 354px); opacity: 1; }
      92%, 100% { transform: translate(180px, 354px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node { opacity: 1 !important; animation: none !important; }
      .connector { stroke-dashoffset: 0 !important; animation: none !important; }
      .traveler { display: none; animation: none !important; }
    }
  </style>
  <rect class="canvas" width="360" height="420" rx="18"/>
  <path class="connector c1" d="M180 66V90"/>
  <path class="connector c2" d="M180 146V170"/>
  <path class="connector c3" d="M180 226V250"/>
  <path class="connector c4" d="M180 306V330"/>
  <g class="node n1"><rect class="node" x="36" y="10" width="288" height="56" rx="12"/><text class="label" x="180" y="44" text-anchor="middle">Approved audit reports</text></g>
  <g class="node n2"><rect class="node" x="36" y="90" width="288" height="56" rx="12"/><text class="label" x="180" y="124" text-anchor="middle">Weekly scheduled job</text></g>
  <g class="node n3"><rect class="node" x="36" y="170" width="288" height="56" rx="12"/><text class="label" x="180" y="204" text-anchor="middle">Batch sent to Claude API</text></g>
  <g class="node n4"><rect class="node" x="36" y="250" width="288" height="56" rx="12"/><text class="label" x="180" y="284" text-anchor="middle">Stored in database</text></g>
  <g class="node n5"><rect class="node" x="36" y="330" width="288" height="56" rx="12"/><text class="label" x="180" y="364" text-anchor="middle">Shown in client portal</text></g>
  <circle class="traveler" cx="0" cy="0" r="4"/>
</svg>
